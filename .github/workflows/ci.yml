name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install → API → Checks → Build
    runs-on: ubuntu-latest
    env:
      FORCE_NODE_GENERATOR: '1'
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client from Swagger mocks
        run: pnpm generate:api:dev

      - name: Typecheck (affected)
        run: pnpm typecheck:affected

      - name: Lint (Biome)
        run: pnpm lint:ci

      - name: Build (affected)
        run: pnpm build:affected
