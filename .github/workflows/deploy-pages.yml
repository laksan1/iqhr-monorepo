name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_NODE_GENERATOR: '1'
  NODE_VERSION: '22'
  VITE_BASE_PATH: /iqhr-monorepo/
  VITE_USE_MOCKS: 'true'
  VITE_API_BASE_URL: ''

jobs:
  deploy:
    name: Build and deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate API client
        run: pnpm generate:api:dev

      - name: Build shell for GitHub Pages
        run: pnpm --filter shell build

      - name: Add SPA fallback for client-side routing
        run: cp apps/shell/dist/index.html apps/shell/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/shell/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
